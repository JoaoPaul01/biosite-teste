<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para a Sarinha</title>
<style>
  :root { --fundo:#fdeef0; --texto:#4a1f33; --rosa:#d6336c; --rosa-claro:#f9c9d6; --card:#fffafb; --suave:#8a5a6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); overflow-x:hidden;
         font-family: "Palatino Linotype", Palatino, Georgia, serif; line-height:1.55; }
  main { position:relative; z-index:1; max-width:440px; margin:0 auto; padding:40px 20px 56px; text-align:center; }
  h1 { font-size:2.4rem; margin:0 0 10px; font-weight:normal; font-style:italic; color:var(--rosa); }
  .msg { margin:0 auto 18px; max-width:34ch; min-height:3.2em; color:var(--suave); font-size:1.05rem; }
  .contador { display:flex; justify-content:center; gap:8px; margin-bottom:26px; }
  .contador div { background:var(--rosa-claro); border-radius:12px; padding:8px 10px; min-width:62px; }
  .contador b { display:block; font-size:1.4rem; color:var(--rosa); }
  .contador small { font-size:.75rem; }
  .vale { display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left;
          background:var(--card); border:2px dashed var(--rosa-claro); border-radius:16px;
          padding:14px 18px; margin-bottom:12px; text-decoration:none; color:inherit; }
  .vale:hover, .vale:focus-visible { border-color:var(--rosa); outline:none; }
  .vale b { display:block; font-size:1.1rem; }
  .vale small { color:var(--suave); }
  .valor { white-space:nowrap; font-style:italic; color:var(--rosa); font-size:.95rem; }
  .botao { display:block; width:100%; padding:14px; margin-top:12px; border-radius:999px; text-decoration:none;
           font:inherit; font-weight:bold; border:2px solid var(--rosa); color:var(--rosa); background:transparent; cursor:pointer; }
  .principal { background:var(--rosa); color:#fff; }
  .razao { margin-top:30px; padding:20px; border-radius:18px; background:var(--card); border:2px solid var(--rosa-claro); }
  .razao p { margin:0 0 6px; min-height:3em; font-style:italic; font-size:1.1rem; }
  .pergunta { margin-top:34px; }
  .pergunta h2 { font-weight:normal; font-style:italic; font-size:1.5rem; margin:0 0 14px; }
  .opcoes { display:flex; gap:14px; justify-content:center; align-items:center; min-height:70px; }
  .opcoes > * { width:auto; margin:0; padding:12px 26px; transition: transform .25s ease; }
  .rodape { margin-top:34px; font-size:.9rem; color:var(--suave); font-style:italic; }

  /* capa */
  #capa { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:18px; background:var(--fundo); cursor:pointer; transition:opacity .8s ease; }
  #capa.some { opacity:0; pointer-events:none; }
  #capa .grande { font-size:5.5rem; animation:pulsa 1.2s ease-in-out infinite; }
  #capa p { margin:0; font-style:italic; color:var(--suave); }
  @keyframes pulsa { 50% { transform:scale(1.18); } }

  /* entrada em cascata */
  .entra { opacity:0; }
  body.aberto .entra { animation: entra .7s ease forwards; animation-delay: calc(var(--i) * .13s + .3s); }
  @keyframes entra { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }

  /* coracoes */
  .fundo { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .flutua { position:absolute; bottom:-40px; opacity:.5; animation: voa linear forwards; }
  @keyframes voa { to { transform:translate(var(--dx), -110vh) rotate(var(--rot)); opacity:0; } }
  .coracao { position:fixed; pointer-events:none; font-size:22px; z-index:30; animation: sobe .9s ease-out forwards; }
  @keyframes sobe { from { opacity:1; transform:translate(0,0) scale(.6); }
                    to   { opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.3); } }
  @media (prefers-reduced-motion: reduce) {
    .flutua, .coracao { display:none; } #capa .grande { animation:none; }
    body.aberto .entra { animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div id="capa"><div class="grande">💌</div><p>Tem uma surpresa pra você. Toque pra abrir.</p></div>
<div class="fundo" id="fundo"></div>

<main>
  <h1 class="entra" id="titulo"></h1>
  <p class="msg entra" id="msg"></p>
  <div class="contador entra" id="contador" hidden></div>
  <div id="vales"></div>
  <div class="razao entra" id="razaoBox">
    <p id="razaoTexto">Toque no botão pra descobrir uma razão.</p>
    <button class="botao" id="razaoBtn">Por que eu te amo? 💌</button>
  </div>
  <div class="pergunta entra" id="pergunta">
    <h2 id="perguntaTexto"></h2>
    <div class="opcoes"><a class="botao principal" id="sim" href="#">Sim 💗</a><button class="botao" id="nao">Não</button></div>
  </div>
  <div id="extras"></div>
  <p class="rodape entra" id="rodape"></p>
</main>

<script>
/* ===== EDITE SÓ ESTE BLOCO ===== */
const c = {
  para: "Sarinha",
  de: "João Paulo",
  mensagem: "Fiz isso pensando em você. Toque num vale pra resgatar, e eu recebo no meu WhatsApp.",
  whatsapp: "5585981287445",
  inicio: "",   // data em que vocês começaram, AAAA-MM-DD (ex.: "2024-06-15"). "" esconde o contador.
  pergunta: "Vai sair comigo no fim de semana?",
  vales: [
    { emoji: "💋", nome: "Beijão",            detalhe: "Longo e sem pressa",        valor: "grátis" },
    { emoji: "😘", nome: "Beijinho",          detalhe: "Rápido, pra qualquer hora", valor: "grátis" },
    { emoji: "💞", nome: "Beijão + beijinho", detalhe: "O combo completo",          valor: "grátis" },
    { emoji: "🤗", nome: "Abraço apertado",   detalhe: "Dura o tempo que você quiser", valor: "grátis" },
    { emoji: "🍕", nome: "Date de comida",    detalhe: "Você escolhe o lugar",      valor: "por minha conta" }
  ],
  razoes: [
    "Seu sorriso me desmonta.",
    "Você me faz rir até nos dias ruins.",
    "Seu abraço é o meu lugar favorito.",
    "Com você até o trânsito fica bom.",
    "Você me faz querer ser melhor."
  ],
  links: [ { texto: "Ver nossas fotos 📸", url: "" } ]   // url "" esconde o botão
};
/* =============================== */

const $ = (id) => document.getElementById(id);
const wa = (m) => "https://wa.me/" + c.whatsapp + "?text=" + encodeURIComponent(m);
const reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

document.title = "Para a " + c.para;
$("titulo").textContent = "Para a " + c.para + " 💗";
$("rodape").textContent = "Feito com carinho por " + c.de;
$("perguntaTexto").textContent = c.pergunta;
$("sim").href = wa("Ela disse SIM! 💗 " + c.pergunta);

$("vales").innerHTML = c.vales.map(v =>
  `<a class="vale entra" href="${wa("Oi amor! Resgatei o vale: " + v.nome + " 💗")}">
     <span><b>${v.emoji} ${v.nome}</b><small>${v.detalhe}</small></span>
     <span class="valor">${v.valor}</span></a>`).join("");

$("extras").innerHTML = c.links.filter(l => l.url)
  .map(l => `<a class="botao entra" href="${l.url}">${l.texto}</a>`).join("");

document.querySelectorAll(".entra").forEach((el, i) => el.style.setProperty("--i", i));

/* contador ao vivo */
function atualiza() {
  const ms = Date.now() - new Date(c.inicio + "T00:00:00");
  if (ms < 0) return;
  const s = Math.floor(ms / 1000);
  const p = [["dias", Math.floor(s / 86400)], ["horas", Math.floor(s / 3600) % 24],
             ["min", Math.floor(s / 60) % 60], ["seg", s % 60]];
  $("contador").innerHTML = p.map(([n, v]) => `<div><b>${v}</b><small>${n}</small></div>`).join("");
  $("contador").hidden = false;
}
if (c.inicio) { atualiza(); setInterval(atualiza, 1000); }

/* corações de fundo */
function flutua() {
  const s = document.createElement("span");
  s.className = "flutua";
  s.textContent = ["💗", "💖", "💕"][Math.floor(Math.random() * 3)];
  s.style.left = Math.random() * 100 + "%";
  s.style.fontSize = 14 + Math.random() * 20 + "px";
  s.style.animationDuration = 7 + Math.random() * 6 + "s";
  s.style.setProperty("--dx", Math.random() * 80 - 40 + "px");
  s.style.setProperty("--rot", Math.random() * 60 - 30 + "deg");
  $("fundo").appendChild(s);
  setTimeout(() => s.remove(), 14000);
}

function chuva(x, y) {
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("span");
    s.className = "coracao";
    s.textContent = ["💗", "💖", "💕", "💘"][i % 4];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.random() * 120 - 60 + "px");
    s.style.setProperty("--dy", -60 - Math.random() * 90 + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

/* mensagem digitando */
function digita(el, texto, vel) {
  if (reduzido) { el.textContent = texto; return; }
  let i = 0;
  const t = setInterval(() => { el.textContent = texto.slice(0, ++i); if (i >= texto.length) clearInterval(t); }, vel);
}

/* abrir a capa */
$("capa").addEventListener("click", (e) => {
  chuva(e.clientX, e.clientY);
  $("capa").classList.add("some");
  document.body.classList.add("aberto");
  setTimeout(() => digita($("msg"), c.mensagem, 35), 900);
  if (!reduzido) { for (let i = 0; i < 6; i++) setTimeout(flutua, i * 250); setInterval(flutua, 900); }
});

/* vales */
$("vales").addEventListener("click", (e) => {
  const a = e.target.closest("a.vale");
  if (!a) return;
  e.preventDefault();
  chuva(e.clientX, e.clientY);
  setTimeout(() => { location.href = a.href; }, reduzido ? 0 : 550);
});

/* razões, sem repetir em sequência */
let ultima = -1;
$("razaoBtn").addEventListener("click", (e) => {
  let n; do { n = Math.floor(Math.random() * c.razoes.length); } while (n === ultima && c.razoes.length > 1);
  ultima = n;
  $("razaoTexto").textContent = "";
  digita($("razaoTexto"), c.razoes[n], 30);
  chuva(e.clientX, e.clientY);
  $("razaoBtn").textContent = "Mais uma 💌";
});

/* botão "Não" que foge */
let fugas = 0;
const nao = $("nao");
function foge(e) {
  e.preventDefault();
  if (++fugas > 6) { nao.textContent = "Tá bom, sim 💗"; nao.style.transform = "none"; nao.onclick = () => location.href = $("sim").href; return; }
  nao.style.transform = `translate(${Math.random() * 120 - 60}px, ${Math.random() * 60 - 30}px)`;
}
nao.addEventListener("pointerenter", foge);
nao.addEventListener("pointerdown", foge);
$("sim").addEventListener("click", (e) => { chuva(e.clientX, e.clientY); });
</script>
</body>
</html>
