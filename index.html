<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia Exemplo</title>
<style>
  :root { --fundo:#f3efe8; --texto:#1c2b2a; --destaque:#1f6f5c; --card:#ffffff; --borda:#d9d2c5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto);
         font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; line-height:1.5; }
  main { max-width:440px; margin:0 auto; padding:32px 20px 48px; }
  h1 { font-size:2rem; margin:0 0 6px; letter-spacing:-0.5px; }
  .desc { margin:0 0 28px; color:#4a5857; }
  .servico { display:flex; align-items:center; justify-content:space-between; gap:12px;
             background:var(--card); border:1px solid var(--borda); border-radius:10px;
             padding:14px 16px; margin-bottom:10px; text-decoration:none; color:inherit; }
  .servico:hover, .servico:focus-visible { border-color:var(--destaque); outline:none; }
  .servico b { display:block; font-size:1.05rem; }
  .servico small { color:#4a5857; }
  .preco { white-space:nowrap; font-weight:bold; color:var(--destaque); }
  .extra { display:block; text-align:center; padding:12px; margin-top:10px; border-radius:10px;
           border:1px solid var(--destaque); color:var(--destaque); text-decoration:none; font-weight:bold; }
  .principal { background:var(--destaque); color:#fff; margin-top:22px; }
  .horario { margin-top:26px; font-size:.9rem; color:#4a5857; text-align:center; }
</style>
</head>
<body>
<main>
  <h1 id="Site da sarinha"></h1>
  <p class="desc" id="desc"></p>
  <div id="servicos"></div>
  <div id="extras"></div>
  <p class="horario" id="horario"></p>
</main>

<script>
/* ===== EDITE SÓ ESTE BLOCO PARA CADA CLIENTE ===== */
const cliente = {
  nome: "Site da sarinha!",
  descricao: "Corte, barba e acabamento. Atendimento com hora marcada.",
  whatsapp: "5585981287445",
  horario: "Seg a Sáb, 9h às 19h",
  servicos: [
    { nome: "Beijão na sarinha", detalhe: "Beijo beijo", preco: "R$ 35" },
    { nome: "Beijinho", detalhe: "Beijo pequeno", preco: "R$ 25" },
    { nome: "Beijão + Beijinho", detalhe: "Combo completo de beijos", preco: "R$ 55" }
  ],
  links: [
    { texto: "Como chegar", url: "https://www.google.com/maps/place/R.+Francisca+Elizabete,+898+-+Maraponga,+Fortaleza+-+CE,+60711-420/@-3.7927617,-38.5759134,17z/data=!3m1!4b1!4m5!3m4!1s0x7c74c2be6cc4227:0x4dce868fd7e924fa!8m2!3d-3.7927617!4d-38.5733385?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D" },
  ]
};
/* ================================================== */

const wa = (msg) => "https://wa.me/" + cliente.whatsapp + "?text=" + encodeURIComponent(msg);

document.title = cliente.nome;
document.getElementById("nome").textContent = cliente.nome;
document.getElementById("desc").textContent = cliente.descricao;
document.getElementById("horario").textContent = cliente.horario;

document.getElementById("servicos").innerHTML = cliente.servicos.map(s =>
  `<a class="servico" href="${wa("Olá! Vim pelo site e quero agendar: " + s.nome)}">
     <span><b>${s.nome}</b><small>${s.detalhe}</small></span>
     <span class="preco">${s.preco}</span>
   </a>`).join("");

document.getElementById("extras").innerHTML =
  `<a class="extra principal" href="${wa("Olá! Vim pelo site.")}">Chamar no WhatsApp</a>` +
  cliente.links.map(l => `<a class="extra" href="${l.url}">${l.texto}</a>`).join("");
</script>
</body>
</html>
